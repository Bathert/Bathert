<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" role="img" aria-labelledby="title desc">
  <title id="title">Microsoft Learn achievement: Введение в создание искусственного интеллекта и агентов</title>
  <desc id="desc">Достижение Microsoft Learn для Дмитрия Эксузьяна, завершено 14.06.2026</desc>
  <defs>
